<nav
  class="max-w-screen-2xl flex flex-wrap items-center justify-between mx-auto p-4"
>
  <a href="" class="flex items-center">
    <img src="assets/santiLogo.png" class="h-8 mr-3" alt="Engineer San" />
  </a>

  <ul class="font-medium flex flex-row space-x-8">
    @if (isLogin()) {
      <li>
        <a
          aria-current="page"
          [routerLink]="navigation.home"
          routerLinkActive="text-blue-700"
          >Home</a
        >
      </li>
      <li>
        <a [routerLink]="navigation.heroNew" routerLinkActive="text-blue-700"
          >New Hero</a
        >
      </li>
      <li>
        <a (click)="logout()">Logout</a>
      </li>
    } @else {
      <li>
        <a [routerLink]="navigation.login" routerLinkActive="text-blue-700"
          >Login</a
        >
      </li>
      <li>
        <a [routerLink]="navigation.register" routerLinkActive="text-blue-700"
          >Register</a
        >
      </li>
    }
  </ul>
</nav>
